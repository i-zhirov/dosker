[workspace]
resolver = "2"
members = [
    "crates/dosker-core",
    "crates/dosker-platform",
    "crates/dosker-engine",
    "crates/dosker-runtime",
    "crates/dosker-test-support",
    "crates/dosker-cli",
    "crates/dosker-agent-proto",
    "crates/dosker-image",
    "crates/dosker-engine-qemu",
    "crates/dosker-engine-dosbox-x",
    "crates/dosker-engine-bochs",
    "crates/dosker-build",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"
toml = "0.8"
spdx = { version = "0.13", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_IO",
] }
dosker-core = { path = "crates/dosker-core" }
dosker-platform = { path = "crates/dosker-platform" }
dosker-engine = { path = "crates/dosker-engine" }
dosker-engine-qemu = { path = "crates/dosker-engine-qemu" }
dosker-engine-dosbox-x = { path = "crates/dosker-engine-dosbox-x" }
dosker-engine-bochs = { path = "crates/dosker-engine-bochs" }
dosker-runtime = { path = "crates/dosker-runtime" }
dosker-test-support = { path = "crates/dosker-test-support" }
dosker-cli = { path = "crates/dosker-cli" }
dosker-agent-proto = { path = "crates/dosker-agent-proto" }
dosker-image = { path = "crates/dosker-image" }
dosker-build = { path = "crates/dosker-build" }
ignore = "0.4"
fatfs = "0.3"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"
base64 = "0.22"
tar = "0.4"
fs2 = "0.4"
ruzstd = "0.9"
zstd = "0.14"
