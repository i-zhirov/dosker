name: CI

on:
  push:
  pull_request:

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required QEMU repository variables
        env:
          DOSKER_FREEDOS_SOURCE: ${{ vars.DOSKER_FREEDOS_SOURCE }}
          DOSKER_QEMU_IMAGE_URL: ${{ vars.DOSKER_QEMU_IMAGE_URL }}
          DOSKER_QEMU_NET_IMAGE_URL: ${{ vars.DOSKER_QEMU_NET_IMAGE_URL }}
          DOSKER_WINDOWS_QEMU_URL: ${{ vars.DOSKER_WINDOWS_QEMU_URL }}
          DOSKER_WINDOWS_QEMU_SHA256: ${{ vars.DOSKER_WINDOWS_QEMU_SHA256 }}
          DOSKER_WINDOWS_QEMU_VERSION: ${{ vars.DOSKER_WINDOWS_QEMU_VERSION }}
        run: bash .github/scripts/check-qemu-variables.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # macOS 14 was retired; macos-15 is the supported arm64 runner.
          - macos-15
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets --features dosker-cli/mock-engine,dosker-cli/qemu-engine
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features dosker-cli/mock-engine,dosker-cli/qemu-engine -- -D warnings
      - name: Unit and mock suites
        run: cargo test --workspace --features dosker-cli/mock-engine
      - name: QEMU adapter unit suites
        run: cargo test -p dosker-engine-qemu
      - name: Transport contract suite
        run: cargo test -p dosker-test-support --test transport_contract
      - name: Detached lifecycle suite
        run: cargo test -p dosker-cli --features mock-engine --test detached_lifecycle

  agent-build:
    name: agent-build
    runs-on: ubuntu-latest
    env:
      WATCOM: /usr/watcom
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenWatcom
        run: |
          installer="$RUNNER_TEMP/open-watcom-2_0-c-linux-x64"
          curl -fsSL -o "$installer" \
            https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/open-watcom-2_0-c-linux-x64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip
          sudo mkdir -p "$WATCOM"
          sudo unzip -q "$installer" -d "$WATCOM"
          sudo chmod -R +x "$WATCOM/binl64" "$WATCOM/binl"
      - name: Configure the DOS toolchain
        run: |
          printf 'PATH=%s/binl64:%s/binl:%s\n' "$WATCOM" "$WATCOM" "$PATH" >> "$GITHUB_ENV"
          printf 'INCLUDE=%s/h\n' "$WATCOM" >> "$GITHUB_ENV"
      - name: Build the DOS agent and RUN test helpers
        run: |
          set -euo pipefail
          agent/build.sh
          for helper in SETBOOT.EXE REBOOT.EXE; do
            test -s "agent/build/$helper" || {
              printf 'missing DOS RUN test helper: %s\n' "$helper" >&2
              exit 1
            }
          done
      - name: Upload the DOS agent binaries
        uses: actions/upload-artifact@v4
        with:
          name: dosker-agent-binaries
          path: |
            agent/build/DOSKER.EXE
            agent/build/EXITCODE.EXE
            agent/build/SETBOOT.EXE
            agent/build/REBOOT.EXE
          if-no-files-found: error

  agent-qemu:
    name: agent-qemu
    runs-on: ubuntu-latest
    needs: [preflight, agent-build]
    timeout-minutes: 45
    env:
      DOSKER_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install QEMU and disk tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 mtools util-linux fdisk curl unzip
      - name: Check the QEMU and disk tools
        run: |
          for tool in timeout fdisk sfdisk mcopy mdir mformat qemu-system-i386; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              printf 'required tool is missing: %s\n' "$tool" >&2
              exit 1
            fi
          done
      - name: Check QEMU discovery
        run: |
          set -euo pipefail
          output="$(cargo run -p dosker-cli --features qemu-engine --bin dosker -- engines)"
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -q '^qemu '; then
            printf '::error::qemu was not discovered\n' >&2
            exit 1
          fi
      - name: Download the DOS agent binaries
        uses: actions/download-artifact@v4
        with:
          name: dosker-agent-binaries
          path: agent/build
      - name: Build the FreeDOS base image
        env:
          DOSKER_FREEDOS_SOURCE: ${{ vars.DOSKER_FREEDOS_SOURCE }}
        run: |
          set -euo pipefail
          source_path="$(bash .github/scripts/fetch-freedos-source.sh)"
          export DOSKER_FREEDOS_SOURCE="$source_path"
          printf 'DOSKER_FREEDOS_SOURCE=%s\n' "$source_path" >> "$GITHUB_ENV"
          agent/tools/build-base-image.sh
      - name: Test the FreeDOS base image
        run: agent/tools/base-image-test.sh
      - name: Test the fixture builder
        run: agent/tools/fixture-test.sh
      - name: Conformance handshake
        run: agent/tools/conformance.sh qemu_handshake
      - name: Conformance exec
        run: agent/tools/conformance.sh qemu_exec
      - name: Conformance transfer
        run: agent/tools/conformance.sh qemu_transfer
      - name: Conformance lifecycle
        run: agent/tools/conformance.sh qemu_lifecycle
      - name: Self-check
        run: agent/tools/self-check.sh
      - name: Download the network image
        env:
          DOSKER_QEMU_NET_IMAGE_URL: ${{ vars.DOSKER_QEMU_NET_IMAGE_URL }}
        run: |
          set -euo pipefail
          url="${DOSKER_QEMU_NET_IMAGE_URL:-}"
          if [ -z "$url" ]; then
            printf '::error::DOSKER_QEMU_NET_IMAGE_URL is not set. Set the repository variable to a raw image URL.\n' >&2
            exit 1
          fi
          mkdir -p agent/fixtures
          if ! curl -fsSL --retry 3 --retry-delay 2 -o agent/fixtures/dosker-net.img "$url"; then
            printf '::error::DOSKER_QEMU_NET_IMAGE_URL download failed: %s\n' "$url" >&2
            exit 1
          fi
          if [ ! -s agent/fixtures/dosker-net.img ]; then
            printf '::error::DOSKER_QEMU_NET_IMAGE_URL did not produce an image: %s\n' "$url" >&2
            exit 1
          fi
          printf 'DOSKER_QEMU_NET_IMAGE=agent/fixtures/dosker-net.img\n' >> "$GITHUB_ENV"
      - name: Rust QEMU runtime suite
        timeout-minutes: 30
        env:
          DOSKER_INTEGRATION: "1"
          DOSKER_QEMU_IMAGE: agent/fixtures/dosker-agent.img
          DOSKER_QEMU: qemu-system-i386
        run: cargo test -p dosker-cli --features qemu-engine --test qemu_runtime -- --nocapture
      - name: Rust volume attach suite
        timeout-minutes: 30
        env:
          DOSKER_INTEGRATION: "1"
          DOSKER_QEMU_IMAGE: agent/fixtures/dosker-agent.img
          DOSKER_QEMU: qemu-system-i386
        run: cargo test -p dosker-cli --features qemu-engine --test qemu_volumes -- --nocapture
      - name: Rust FreeDOS base and injection suite
        timeout-minutes: 30
        env:
          DOSKER_INTEGRATION: "1"
          DOSKER_QEMU: qemu-system-i386
          DOSKER_FREEDOS_BASE_IMAGE: agent/fixtures/freedos-base.img
        run: cargo test -p dosker-cli --features qemu-engine --test qemu_freedos -- --nocapture
      - name: Rust build integration suite
        timeout-minutes: 30
        env:
          DOSKER_INTEGRATION: "1"
          DOSKER_QEMU_IMAGE: agent/fixtures/dosker-agent.img
          DOSKER_QEMU: qemu-system-i386
        run: cargo test -p dosker-cli --features qemu-engine --test qemu_build -- --nocapture
      - name: Verify the downloaded RUN test helpers
        run: |
          set -euo pipefail
          for helper in SETBOOT.EXE REBOOT.EXE; do
            test -s "agent/build/$helper" || {
              printf 'missing downloaded DOS RUN test helper: %s\n' "$helper" >&2
              exit 1
            }
          done
      - name: Rust RUN integration suite
        timeout-minutes: 30
        env:
          DOSKER_INTEGRATION: "1"
          DOSKER_QEMU_IMAGE: agent/fixtures/dosker-agent.img
          DOSKER_QEMU: qemu-system-i386
        run: cargo test -p dosker-cli --features qemu-engine --test qemu_run -- --nocapture
      - name: Rust published port suite
        timeout-minutes: 30
        env:
          DOSKER_INTEGRATION: "1"
          DOSKER_QEMU: qemu-system-i386
        run: cargo test -p dosker-cli --features qemu-engine --test qemu_ports -- --nocapture

  freedos-base-determinism:
    name: freedos-base-determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [preflight, agent-build]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install QEMU
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install qemu
          else
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86
          fi
      - name: Download the DOS agent binaries
        uses: actions/download-artifact@v4
        with:
          name: dosker-agent-binaries
          path: agent/build
      - name: Fetch the FreeDOS source
        env:
          DOSKER_FREEDOS_SOURCE: ${{ vars.DOSKER_FREEDOS_SOURCE }}
        run: |
          set -euo pipefail
          source_path="$(bash .github/scripts/fetch-freedos-source.sh)"
          printf 'DOSKER_FREEDOS_SOURCE=%s\n' "$source_path" >> "$GITHUB_ENV"
      - name: Build the base in two roots
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freedos-context"
          printf 'FROM freedos:1.3\n' > "$RUNNER_TEMP/freedos-context/Doskerfile"

          build_digest() {
            local root="$1"
            DOSKER_ROOT="$root" DOSKER_AGENT_EXE=agent/build/DOSKER.EXE \
              cargo run -q -p dosker-cli -- build -t check:latest "$RUNNER_TEMP/freedos-context" \
              | sed -n 's/^built check:latest //p'
          }

          digest_a="$(build_digest "$RUNNER_TEMP/root-a")"
          digest_b="$(build_digest "$RUNNER_TEMP/root-b")"

          printf '%s\n' "$digest_a" > "$RUNNER_TEMP/freedos-base-digest-a.txt"
          printf '%s\n' "$digest_b" > "$RUNNER_TEMP/freedos-base-digest-b.txt"

          if [ -z "$digest_a" ] || [ -z "$digest_b" ]; then
            printf '::error::the FreeDOS base build did not report a digest\n' >&2
            exit 1
          fi
          if [ "$digest_a" != "$digest_b" ]; then
            printf '::error::the FreeDOS base digests differ: %s vs %s\n' "$digest_a" "$digest_b" >&2
            exit 1
          fi
          printf '%s\n' "$digest_a" > "$RUNNER_TEMP/freedos-base-digest.txt"
      - name: Upload the determinism digest
        uses: actions/upload-artifact@v4
        with:
          name: freedos-base-digest-${{ matrix.os }}
          path: ${{ runner.temp }}/freedos-base-digest.txt
          if-no-files-found: error

  compare-freedos-base:
    name: compare-freedos-base
    runs-on: ubuntu-latest
    needs: freedos-base-determinism
    steps:
      - name: Download the Ubuntu digest
        uses: actions/download-artifact@v4
        with:
          name: freedos-base-digest-ubuntu-latest
          path: ${{ runner.temp }}/digest-ubuntu
      - name: Download the macOS digest
        uses: actions/download-artifact@v4
        with:
          name: freedos-base-digest-macos-15
          path: ${{ runner.temp }}/digest-macos
      - name: Compare the digests
        run: |
          set -euo pipefail
          ubuntu="$(cat "$RUNNER_TEMP/digest-ubuntu/freedos-base-digest.txt")"
          macos="$(cat "$RUNNER_TEMP/digest-macos/freedos-base-digest.txt")"
          if [ "$ubuntu" != "$macos" ]; then
            printf '::error::the FreeDOS base digests differ across hosts: ubuntu=%s macos=%s\n' "$ubuntu" "$macos" >&2
            exit 1
          fi
          printf 'the FreeDOS base digest matches across hosts: %s\n' "$ubuntu"

  windows-qemu:
    name: windows-qemu
    runs-on: windows-latest
    needs: [preflight, agent-build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        shell: pwsh
        env:
          DOSKER_WINDOWS_QEMU_URL: ${{ vars.DOSKER_WINDOWS_QEMU_URL }}
          DOSKER_WINDOWS_QEMU_SHA256: ${{ vars.DOSKER_WINDOWS_QEMU_SHA256 }}
          DOSKER_WINDOWS_QEMU_VERSION: ${{ vars.DOSKER_WINDOWS_QEMU_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\qemu-setup.exe"
          Invoke-WebRequest -Uri $env:DOSKER_WINDOWS_QEMU_URL -OutFile $installer

          $expected = $env:DOSKER_WINDOWS_QEMU_SHA256.Trim().ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "the QEMU installer checksum does not match DOSKER_WINDOWS_QEMU_SHA256: expected $expected, got $actual"
            exit 1
          }

          $installDir = "$env:RUNNER_TEMP\qemu"
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Write-Error "the QEMU installer exited with code $($install.ExitCode)"
            exit 1
          }

          $binary = Get-ChildItem -Path $installDir -Filter 'qemu-system-i386.exe' -Recurse -File | Select-Object -First 1
          if ($null -eq $binary) {
            Write-Error 'the QEMU installation does not contain qemu-system-i386.exe'
            exit 1
          }

          $binarySha256 = (Get-FileHash -Algorithm SHA256 -Path $binary.FullName).Hash.ToLowerInvariant()

          Add-Content -Path $env:GITHUB_ENV -Value "DOSKER_QEMU=$($binary.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "DOSKER_QEMU_SHA256=$binarySha256"
          Add-Content -Path $env:GITHUB_ENV -Value "DOSKER_QEMU_VERSION=$($env:DOSKER_WINDOWS_QEMU_VERSION)"
      - name: Check QEMU discovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & cargo run -p dosker-cli --features qemu-engine --bin dosker -- engines 2>&1 | Out-String
          Write-Output $output
          if ($output -notmatch ('qemu ' + [regex]::Escape($env:DOSKER_QEMU_VERSION))) {
            Write-Error "qemu $($env:DOSKER_QEMU_VERSION) was not discovered"
            exit 1
          }
      - name: Download the prepared image
        shell: pwsh
        env:
          DOSKER_QEMU_IMAGE_URL: ${{ vars.DOSKER_QEMU_IMAGE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = $env:DOSKER_QEMU_IMAGE_URL
          if ($url -match '(?i)\.zip$') {
            $archive = "$env:RUNNER_TEMP\dosker-image.zip"
            Invoke-WebRequest -Uri $url -OutFile $archive

            $extract = "$env:RUNNER_TEMP\dosker-image"
            if (Test-Path $extract) {
              Remove-Item -Recurse -Force $extract
            }
            Expand-Archive -Path $archive -DestinationPath $extract -Force

            $image = Get-ChildItem -Path $extract -Filter '*.img' -Recurse -File | Select-Object -First 1
            if ($null -eq $image) {
              Write-Error "the image archive contains no .img file: $url"
              exit 1
            }
            $imagePath = $image.FullName
          } else {
            $imagePath = "$env:RUNNER_TEMP\dosker-agent.img"
            Invoke-WebRequest -Uri $url -OutFile $imagePath
          }

          if (-not (Test-Path $imagePath) -or (Get-Item $imagePath).Length -eq 0) {
            Write-Error "the image download produced no image: $url"
            exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DOSKER_QEMU_IMAGE=$imagePath"
      - name: Download the DOS agent binaries
        uses: actions/download-artifact@v4
        with:
          name: dosker-agent-binaries
          path: agent/build
      - name: Windows QEMU smoke suite
        env:
          DOSKER_INTEGRATION: "1"
        run: cargo test -p dosker-cli --features qemu-engine --test windows_qemu_runtime -- --nocapture
