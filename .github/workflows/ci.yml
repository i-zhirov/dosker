name: CI

on:
  push:
  pull_request:

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets --features dosker-cli/mock-engine
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features dosker-cli/mock-engine -- -D warnings
      - name: Windows transport contract
        if: runner.os == 'Windows'
        run: cargo test -p dosker-test-support --test transport_contract -- --nocapture
      - name: Windows supervisor suite
        if: runner.os == 'Windows'
        run: cargo test -p dosker-runtime --test supervisor -- --test-threads=1 --nocapture
      - name: Windows run trace
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "dosker-trace"
          New-Item -ItemType Directory -Force $root | Out-Null
          $env:DOSKER_ROOT = $root
          $env:DOSKER_MOCK_ENGINE = (Resolve-Path "target\debug\mock-engine.exe").Path
          $p = Start-Process -FilePath "target\debug\dosker.exe" -ArgumentList "run","-d","freedos:latest" -NoNewWindow -PassThru -RedirectStandardOutput "$root\run.out" -RedirectStandardError "$root\run.err"
          if (-not $p.WaitForExit(15000)) {
            Write-Host "run did not exit within 15s"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "run exit code: $($p.ExitCode)"
          }
          Write-Host "--- stdout ---"
          Get-Content "$root\run.out" -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"
          Get-Content "$root\run.err" -ErrorAction SilentlyContinue
          Write-Host "--- tree ---"
          Get-ChildItem -Recurse $root | Select-Object FullName, Length
          Write-Host "--- state ---"
          Get-Content "$root\containers\*\state.json" -ErrorAction SilentlyContinue
          Write-Host "--- container log ---"
          Get-Content "$root\containers\*\container.log" -ErrorAction SilentlyContinue
          Get-Process dosker,mock-engine -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Windows exec suite
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: cargo test -p dosker-cli --features mock-engine --test cli_exec -- --test-threads=1 --nocapture
      - name: Unit and mock suites
        run: cargo test --workspace --features dosker-cli/mock-engine
      - name: Transport contract suite
        run: cargo test -p dosker-test-support --test transport_contract
      - name: Detached lifecycle suite
        run: cargo test -p dosker-cli --features mock-engine --test detached_lifecycle
