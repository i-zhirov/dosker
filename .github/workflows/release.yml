name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

# Top-level permissions: contents: read.
# The publish job overrides this with permissions: contents: write.
permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              printf '::error::the release tag must match v*: %s\n' "$RELEASE_TAG" >&2
              exit 1
              ;;
          esac
      - name: Read the workspace version
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dosker-cli") | .version')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build the Linux binary
        run: cargo build -p dosker-cli --release --target x86_64-unknown-linux-gnu --bin dosker --features qemu-engine
      - name: Strip the Linux binary
        run: strip target/x86_64-unknown-linux-gnu/release/dosker
      - name: Package the Linux artifact
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          mkdir -p dist
          stage="$(mktemp -d)"
          install -m 0755 target/x86_64-unknown-linux-gnu/release/dosker "$stage/dosker"
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "dist/dosker-$version-linux-x86_64.tar.gz" -C "$stage" .
          (cd dist && sha256sum "dosker-$version-linux-x86_64.tar.gz" > "dosker-$version-linux-x86_64.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dosker-linux-x86_64
          path: dist/dosker-*
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-15
    needs: version
    outputs:
      signed: ${{ steps.sign.outputs.signed || 'no' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin
      - name: Build the macOS binary
        run: cargo build -p dosker-cli --release --target aarch64-apple-darwin --bin dosker --features qemu-engine
      - name: Strip the macOS binary
        run: strip target/aarch64-apple-darwin/release/dosker
      - name: Check signing secrets
        id: signing-check
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$MACOS_CERTIFICATE" ] \
            && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] \
            && [ -n "$MACOS_NOTARY_APPLE_ID" ] \
            && [ -n "$MACOS_NOTARY_PASSWORD" ] \
            && [ -n "$MACOS_TEAM_ID" ]; then
            printf 'has_signing=yes\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_signing=no\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Sign and notarize the macOS binary
        id: sign
        if: steps.signing-check.outputs.has_signing == 'yes'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -u
          signed=no
          keychain="$RUNNER_TEMP/dosker-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          cert="$RUNNER_TEMP/dosker-certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$cert"
          if security create-keychain -p "$keychain_password" "$keychain" \
            && security set-keychain-settings -lut 21600 "$keychain" \
            && security unlock-keychain -p "$keychain_password" "$keychain" \
            && security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            && security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" \
            && security list-keychains -d user -s "$keychain"; then
            binary="target/aarch64-apple-darwin/release/dosker"
            if codesign --force --options runtime --timestamp --sign "Developer ID Application" "$binary"; then
              zip="$RUNNER_TEMP/dosker-notarize.zip"
              ditto -c -k --keepParent "$binary" "$zip"
              if xcrun notarytool submit "$zip" --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_TEAM_ID" --wait; then
                signed=yes
              fi
            fi
          fi
          printf 'signed=%s\n' "$signed" >> "$GITHUB_OUTPUT"
      - name: Clean up the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dosker-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/dosker-certificate.p12"
      - name: Package the macOS artifact
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          mkdir -p dist
          stage="$(mktemp -d)"
          install -m 0755 target/aarch64-apple-darwin/release/dosker "$stage/dosker"
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "dist/dosker-$version-macos-arm64.tar.gz" -C "$stage" .
          (cd dist && shasum -a 256 "dosker-$version-macos-arm64.tar.gz" > "dosker-$version-macos-arm64.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dosker-macos-arm64
          path: dist/dosker-*
          if-no-files-found: error

  windows-x86_64:
    name: windows-x86_64
    runs-on: windows-latest
    needs: version
    outputs:
      signed: ${{ steps.sign.outputs.signed || 'no' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build the Windows binary
        run: cargo build -p dosker-cli --release --target x86_64-pc-windows-msvc --bin dosker --features qemu-engine
      - name: Check signing secrets
        id: signing-check
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'has_signing=yes'
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'has_signing=no'
          }
      - name: Sign the Windows binary
        id: sign
        if: steps.signing-check.outputs.has_signing == 'yes'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Continue'
          $signed = 'no'
          $pfx = Join-Path $env:RUNNER_TEMP 'dosker-certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $binary = 'target/x86_64-pc-windows-msvc/release/dosker.exe'
          & signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $binary
          if ($LASTEXITCODE -eq 0) {
            $signed = 'yes'
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=$signed"
      - name: Clean up the signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'dosker-certificate.pfx')
      - name: Package the Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.version.outputs.version }}'
          $dist = 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'dosker-windows-stage'
          if (Test-Path $stage) {
            Remove-Item -Recurse -Force $stage
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/dosker.exe' (Join-Path $stage 'dosker.exe')
          Copy-Item 'README.md', 'LICENSE-MIT', 'LICENSE-APACHE' $stage
          $archive = Join-Path $dist "dosker-$version-windows-x86_64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -Value "$hash  dosker-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dosker-windows-x86_64
          path: dist/dosker-*
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [version, linux-x86_64, macos-arm64, windows-x86_64]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dosker-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        run: |
          # shellcheck disable=SC2035
          cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Check the tag and version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            printf '::error::release tag %s does not match version %s\n' "$RELEASE_TAG" "$VERSION" >&2
            exit 1
          fi
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MACOS_SIGNED: ${{ needs.macos-arm64.outputs.signed }}
          WINDOWS_SIGNED: ${{ needs.windows-x86_64.outputs.signed }}
        run: |
          set -euo pipefail
          macos="unsigned"
          if [ "$MACOS_SIGNED" = "yes" ]; then
            macos="signed"
          fi
          windows="unsigned"
          if [ "$WINDOWS_SIGNED" = "yes" ]; then
            windows="signed"
          fi
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<EOF
          DOSker $VERSION

          - Linux: unsigned
          - macOS: $macos
          - Windows: $windows

          Verify the archives from the download directory:
          - Linux: sha256sum -c SHA256SUMS
          - macOS: shasum -a 256 -c SHA256SUMS
          - Windows: Get-FileHash -Algorithm SHA256, then compare the printed hash with SHA256SUMS

          DOSker does not sandbox untrusted images. Use an outer VM for untrusted input.
          EOF
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$RELEASE_TAG" --title "DOSker $VERSION" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" dist/*
