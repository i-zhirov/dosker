[sdl]
output = surface
videodriver = dummy
showmenu = false

[log]
logfile = /Users/iliazhirov/dosbox-x-spike/net.log

[dos]
log console = true

[dosbox]
machine = svga_s3
memsize = 16
mcp_server = 0

[cpu]
cputype = 486

[sblaster]
sbtype = sb16

[ide, primary]
enable = true

[ne2000]
ne2000 = true
nicbase = 300
nicirq = 9
backend = slirp

[ethernet, slirp]
tcp_port_forwards = 8080:80

[serial]
serial1 = dummy
serial2 = dummy

[autoexec]
IMGMOUNT C /Users/iliazhirov/dosbox-x-spike/net.img -t hdd
BOOT C:
